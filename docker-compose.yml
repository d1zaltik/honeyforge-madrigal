name: sysmon

services:
  # ==========================================
  # Relational Database Store: PostgreSQL (FR-C2 / Stage 2)
  # ==========================================
  db-store:
    image: postgres:15-alpine
    container_name: db-store
    restart: unless-stopped
    networks:
      internal_mgmt:
        ipv4_address: 172.29.0.5
    environment:
      - POSTGRES_USER=honeyforge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-honeyforge_pass_2026}
      - POSTGRES_DB=honeyforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyforge -d honeyforge"]
      interval: 4s
      timeout: 4s
      retries: 6

  # ==========================================
  # Central Management Backend (C2) - app-backend
  # ==========================================
  app-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: app-backend
    restart: unless-stopped
    networks:
      internal_mgmt:
        ipv4_address: 172.29.0.2
    # MASK-1 / MASK-3: Port 8000 is internal-only inside internal_mgmt.
    # No direct route or publication to DMZ or host.
    environment:
      - HONEYFORGE_HOST=0.0.0.0
      - HONEYFORGE_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://honeyforge:honeyforge_pass_2026@db-store:5432/honeyforge}
      - JWT_SECRET=${JWT_SECRET:-honeyforge_jwt_secret_key_demo_2026_very_secure}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ANALYST_PASSWORD=${ANALYST_PASSWORD:-}
      - NODE_KEY_LOW=${NODE_KEY_LOW:-1f9669734828e377802124ff4a43c33fd3bd74e66cba7bab}
      - NODE_KEY_MED=${NODE_KEY_MED:-3e872c0119854b81a291cf5429188d227b61c94481309f45}
      - NODE_LOW_ID=${NODE_LOW_ID:-n-7f3a}
      - NODE_MED_ID=${NODE_MED_ID:-n-8c1b}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,https://localhost,https://localhost:443,http://127.0.0.1,http://127.0.0.1:80,https://127.0.0.1,https://127.0.0.1:443
    volumes:
      - ./honeyforge_server:/app/honeyforge_server
    depends_on:
      db-store:
        condition: service_healthy

  # ==========================================
  # Agent Telemetry Edge Proxy (DMZ + Mgmt) - static-edge
  # ==========================================
  static-edge:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: static-edge
    restart: unless-stopped
    networks:
      internal_mgmt:
        ipv4_address: 172.29.0.3
      edge_dmz:
        ipv4_address: 172.28.0.3
        aliases:
          - nginx-proxy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/nginx-edge.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:rw
    depends_on:
      - app-backend

  # ==========================================
  # Operator SOC Web & API Gateway (Mgmt Only, Unreachable from DMZ)
  # ==========================================
  mgmt-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: mgmt-gateway
    restart: unless-stopped
    networks:
      internal_mgmt:
        ipv4_address: 172.29.0.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-mgmt.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - static-edge
      - app-backend

  # ==========================================
  # Low-Interaction Perimeter Probe (DMZ Isolated)
  # ==========================================
  network-probe:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: systemd-resolved-low
    restart: unless-stopped
    networks:
      edge_dmz:
        ipv4_address: 172.28.0.10
    ports:
      - "2121:2121"
      - "2323:2323"
      - "6379:6379"
      - "50000-50050:50000-50050"
    environment:
      - NODE_ID=n-7f3a
      - NODE_KEY_FILE=/run/secrets/node_key
      - UPSTREAM_URL=https://static-edge
      - INTERACTION_LEVEL=low
      - PROC_NAME=systemd-resolved
      - SYNC_INTERVAL=8
      - JITTER_PCT=30
      - SSL_CERT_PATH=/etc/ssl/certs/static-edge.crt
      - PERSISTENT_DATA_DIR=/var/lib/sysmon/data
      - BUFFER_DB_PATH=/var/lib/sysmon/data/events.db
    volumes:
      - ./docker/certs/static-edge.crt:/etc/ssl/certs/static-edge.crt:ro
      - ./docker/keys/node_low.key:/run/secrets/node_key:ro
      - sys_low_state:/var/lib/sysmon
    depends_on:
      - static-edge

  # ==========================================
  # Medium-Interaction SSH & Web Probe (DMZ Isolated)
  # ==========================================
  syslog-collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: rsyslogd-med
    restart: unless-stopped
    networks:
      edge_dmz:
        ipv4_address: 172.28.0.20
    ports:
      - "2222:2222"
      - "8088:8088"
    environment:
      - NODE_ID=n-8c1b
      - NODE_KEY_FILE=/run/secrets/node_key
      - UPSTREAM_URL=https://static-edge
      - INTERACTION_LEVEL=medium
      - SSH_PORT=2222
      - WEB_PORT=8088
      - PROC_NAME=rsyslogd
      - SYNC_INTERVAL=6
      - JITTER_PCT=40
      - SSL_CERT_PATH=/etc/ssl/certs/static-edge.crt
      - SSH_KEYS_DIR=/etc/ssh
      - PERSISTENT_DATA_DIR=/var/lib/sysmon/data
      - BUFFER_DB_PATH=/var/lib/sysmon/data/events.db
    volumes:
      - ./docker/certs/static-edge.crt:/etc/ssl/certs/static-edge.crt:ro
      - ./docker/keys/node_med.key:/run/secrets/node_key:ro
      - sys_ssh_keys:/etc/ssh
      - sys_med_state:/var/lib/sysmon
    depends_on:
      - static-edge

  # ==========================================
  # Dedicated Attacker Simulator (Isolated DMZ)
  # ==========================================
  sec-scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile.attacker
    container_name: sec-scanner
    restart: unless-stopped
    networks:
      edge_dmz:
        ipv4_address: 172.28.0.30
      internal_mgmt:
        ipv4_address: 172.29.0.30
        aliases:
          - sec-scanner
          - honeyforge-attacker
    ports:
      - "9000:9000"
    environment:
      - UPSTREAM_URL=https://static-edge
      - SSL_CERT_PATH=/etc/ssl/certs/static-edge.crt
    volumes:
      - ./docker/certs/static-edge.crt:/etc/ssl/certs/static-edge.crt:ro
    depends_on:
      - network-probe
      - syslog-collector
      - static-edge

networks:
  # Isolated DMZ segment for traps and simulated attackers (MASK-3)
  edge_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

  # Out-of-band management segment for C2 backend and DB (no route from DMZ)
  internal_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  postgres_data:
  sys_ssh_keys:
  sys_low_state:
  sys_med_state:
