events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type text/html;
    
    # Stock nginx behavior: server_tokens on (identifying as generic nginx)
    server_tokens on;

    log_format stealth '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length';
    access_log /var/log/nginx/access.log stealth;
    access_log /dev/stdout stealth;

    upstream backend_nodes {
        server app-backend:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;
        return 404;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/honeyforge.crt;
        ssl_certificate_key /etc/nginx/certs/honeyforge.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_tickets off;

        # Stock Nginx error interception for zero-leakage 404 stealth
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 500 502 503 504 = @stock_404;

        # Strip all backend identifying headers
        proxy_hide_header Vary;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        location @stock_404 {
            default_type text/html;
            return 404;
        }

        # 1. Primary Disguised RUM Ingestion Endpoint (MASK-2)
        location = /cdn-cgi/rum {
            proxy_pass http://backend_nodes/cdn-cgi/rum;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. Alternative Static Metrics Ingestion Endpoint
        location = /static/v2/metrics {
            proxy_pass http://backend_nodes/static/v2/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Disguised Transparent GIF Pixel & Trace Beacons
        location = /static/pixel.gif {
            proxy_pass http://backend_nodes/static/pixel.gif;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /cdn-cgi/trace {
            proxy_pass http://backend_nodes/cdn-cgi/trace;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 5. Dynamic Canary token trigger & Node configuration routes
        location /sync/ {
            proxy_pass http://backend_nodes/sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # All other paths (including /, /api/, /ws/, /docs, /openapi.json, random-xyz) return stock 404
        location / {
            default_type text/html;
            return 404;
        }
    }
}
