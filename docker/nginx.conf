events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server_tokens off;

    upstream c2_backend {
        server honeyforge-c2:8000;
    }

    server {
        listen 80;
        server_name _;

        # Disguised telemetry route (MASK-2)
        location /v1/telemetry/collect {
            proxy_pass http://c2_backend/v1/telemetry/collect;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Disguised 1x1 GIF pixel beacon
        location /cdn-cgi/telemetry/pixel.gif {
            proxy_pass http://c2_backend/cdn-cgi/telemetry/pixel.gif;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket real-time event stream
        location /ws/attacks {
            proxy_pass http://c2_backend/ws/attacks;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # All other C2 endpoints and SOC dashboard
        location / {
            proxy_pass http://c2_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
