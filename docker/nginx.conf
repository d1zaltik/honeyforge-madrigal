events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server_tokens off;

    # Rate limiting zone for authentication (5 requests per minute, burst 5)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Privacy-preserving log format for WebSocket connection (strips query parameters / tickets)
    log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    upstream c2_backend {
        # Primary container name is app-backend
        server app-backend:8000 max_fails=3 fail_timeout=10s;
    }

    # HTTP Server (port 80): Automatic 301 Redirect to HTTPS (port 443)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS / TLS Server (port 443) - MASK-1 Encrypted Telemetry & Management
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/honeyforge.crt;
        ssl_certificate_key /etc/nginx/certs/honeyforge.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_tickets off;

        # Hardened Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Rate-limited operator login endpoint
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://c2_backend/api/v1/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Primary Neutral RUM Ingestion Endpoint (MASK-2)
        location /cdn-cgi/rum {
            proxy_pass http://c2_backend/cdn-cgi/rum;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Alternative Static Metrics Ingestion Endpoint
        location /static/v2/metrics {
            proxy_pass http://c2_backend/static/v2/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Disguised 1x1 GIF pixel beacon
        location /static/pixel.gif {
            proxy_pass http://c2_backend/static/pixel.gif;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket real-time event stream (uses no_query log format to prevent ticket leaking)
        location /ws/attacks {
            access_log /var/log/nginx/access.log no_query;
            proxy_pass http://c2_backend/ws/attacks;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Disguised canary trigger & config endpoint
        location /sync/ {
            proxy_pass http://c2_backend/sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # All other C2 endpoints and SOC dashboard
        location / {
            proxy_pass http://c2_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
